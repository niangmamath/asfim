name: ASFIM Sync

on:
  schedule:
    # 03:00 UTC ≈ après la publication ASFIM habituelle (~01:00 heure du Maroc)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: asfim-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ASFIM_Downloader
        run: pip install -r requirements.txt

      # sync.py lit l'état (dates déjà connues) directement depuis history.json
      # sur Vercel Blob, met à jour l'objet en mémoire de façon incrémentale pour
      # les nouvelles dates, et écrit history.json + funds.json localement.
      # Plus de base SQLite ni de commit git : l'état ne vit que sur Blob.
      - name: Synchroniser (sync.py)
        id: sync
        working-directory: ASFIM_Downloader
        env:
          HISTORY_JSON_URL: https://nhxdf2l6bfma6u8j.public.blob.vercel-storage.com/history.json
        run: python sync.py

      - name: Setup Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer le SDK Vercel Blob
        if: steps.sync.outputs.changed == 'true'
        working-directory: ASFIM_Downloader/scripts
        run: npm install

      - name: Uploader history.json sur Vercel Blob
        if: steps.sync.outputs.changed == 'true'
        working-directory: ASFIM_Downloader/scripts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node upload_history.mjs ../history.json history.json

      - name: Uploader funds.json sur Vercel Blob
        if: steps.sync.outputs.changed == 'true'
        working-directory: ASFIM_Downloader/scripts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node upload_history.mjs ../funds.json funds.json
