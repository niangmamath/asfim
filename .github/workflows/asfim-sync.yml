name: ASFIM Sync

on:
  schedule:
    # 03:00 UTC ≈ après la publication ASFIM habituelle (~01:00 heure du Maroc)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: asfim-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ASFIM_Downloader
        run: pip install -r requirements.txt

      # sync.py lit l'index (dates déjà connues) depuis Vercel Blob, ne traite que
      # les publications plus récentes que la plus récente connue (pas de
      # reconquête de tout l'historique ASFIM), et écrit dans blob_out/ un miroir
      # local de l'arborescence Blob à uploader : history.json (index léger),
      # history/<date>.json (un fichier par nouvelle date), funds.json.
      - name: Synchroniser (sync.py)
        id: sync
        working-directory: ASFIM_Downloader
        env:
          HISTORY_JSON_URL: https://nhxdf2l6bfma6u8j.public.blob.vercel-storage.com/history.json
        run: python sync.py

      - name: Setup Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer le SDK Vercel Blob
        if: steps.sync.outputs.changed == 'true'
        working-directory: ASFIM_Downloader/scripts
        run: npm install

      - name: Uploader blob_out/ sur Vercel Blob (un fichier par date)
        if: steps.sync.outputs.changed == 'true'
        working-directory: ASFIM_Downloader
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          find blob_out -type f | while read -r f; do
            target="${f#blob_out/}"
            echo "-> $target"
            node scripts/upload_history.mjs "$f" "$target"
          done
